<!doctype html>
<meta charset="utf-8">
<pre id="out">starting...</pre>
<script type="importmap">{"imports":{"three":"./vendor/build/three.module.js","three/addons/":"./vendor/examples/jsm/"}}</script>
<script type="module">
const out = document.querySelector('#out');
const report = [];
const show = (label, value) => {
  report.push(`${label}: ${value}`);
  out.textContent = report.join('\n');
};
window.addEventListener('error', event => show('error', event.error?.stack || event.message));
window.addEventListener('unhandledrejection', event => show('rejection', event.reason?.stack || event.reason));
try {
  const core = await import('three');
  show('three', Object.keys(core).length);
  const gltf = await import('three/addons/loaders/GLTFLoader.js');
  show('gltf', typeof gltf.GLTFLoader);
  const draco = await import('three/addons/loaders/DRACOLoader.js');
  show('draco', typeof draco.DRACOLoader);
  const controls = await import('three/addons/controls/OrbitControls.js');
  show('controls', typeof controls.OrbitControls);
  const env = await import('three/addons/environments/RoomEnvironment.js');
  show('environment', typeof env.RoomEnvironment);
} catch (error) {
  show('caught', error.stack || error);
}
</script>
